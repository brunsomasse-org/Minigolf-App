name: Feature Branch CI / Test Pipeline

on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ "*" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter / code checks
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm test --if-present

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Container Build (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: minigolf-app:test-${{ github.sha }}
